# 原则上只写与 mpv 默认键位不同的部分 (默认键位见 /usr/share/doc/mpv/input.conf).
# - 出现在右键菜单里的默认键也写一遍 (b s S x I q), uosc 只给写了键的菜单项显示快捷键.
# - 键位按 DE 布局设计. 早就看 {[]} 不爽了!
# - 右键菜单: uosc 从本文件行尾的「`#`+`!`」注释生成菜单, 顺序即行序, `>` 分隔子菜单.
#   (注释里不能出现字面的`#`+`!`, 否则 uosc 也会把它当成菜单项).
# - 键位写成 `#` 的行只出现在菜单里、不绑定按键.

# 不在菜单里的键
MBTN_RIGHT  script-binding uosc/menu                      # 默认是暂停
MBTN_LEFT   cycle pause                                   # 默认双击全屏
SPACE       script-binding hold_speed/hold                # 单击暂停, 长按 3 倍速
UP          no-osd add volume  5; script-message-to uosc flash-elements volume     # 默认 seek ±60 s
DOWN        no-osd add volume -5; script-message-to uosc flash-elements volume
WHEEL_UP    no-osd add volume  10; script-message-to uosc flash-elements volume    # 默认 ±2
WHEEL_DOWN  no-osd add volume -10; script-message-to uosc flash-elements volume
WHEEL_LEFT  ignore                                        # 默认 seek ±10 s
WHEEL_RIGHT ignore
Shift+UP    seek  85 exact                                # 跳 OP/ED; 默认 ±5 s
Shift+DOWN  seek -85 exact
# 速度
ü           no-osd add speed -0.1; script-message-to uosc flash-elements speed
+           no-osd add speed  0.1; script-message-to uosc flash-elements speed
Ü           no-osd multiply speed 0.5; script-message-to uosc flash-elements speed
*           no-osd multiply speed 2.0; script-message-to uosc flash-elements speed  # 默认是音量 +2
# 旋转; 覆盖默认的画面左右平移
Alt+LEFT    cycle-values video-rotate 0 270 180 90; show-text "旋转: ${video-rotate}°"
Alt+RIGHT   cycle-values video-rotate 0 90 180 270; show-text "旋转: ${video-rotate}°"

# 右键菜单
# 打开
#           script-binding uosc/open-file                 #! 打开 > 打开文件
#           script-binding uosc/items                     #! 打开 > 播放列表
#           script-binding uosc/chapters                  #! 打开 > 章节
#           script-binding select/select-watch-history    #! 打开 > 播放历史
#           script-binding uosc/show-in-directory         #! 打开 > 在文件管理器中显示

# 轨道
#           script-binding uosc/subtitles                 #! 轨道 > 字幕
#           script-binding uosc/audio                     #! 轨道 > 音频
#           script-binding uosc/video                     #! 轨道 > 视频
#           script-binding uosc/load-subtitles            #! 轨道 > 加载外挂字幕
#           script-binding uosc/audio-device              #! 轨道 > 音频设备
# DE 布局下 y 与 x 相邻 (默认是 z / x)
x           add sub-delay 0.1                             #! 轨道 > 字幕延迟 +0.1 秒
y           add sub-delay -0.1                            #! 轨道 > 字幕延迟 -0.1 秒
#           set sub-delay 0                               #! 轨道 > 字幕延迟重置

# 画面
# Anime4K Mode A (官方组合). Ctrl+1 开关 Fast 档, Ctrl+2 开关 HQ 档; 一档开着时按另一个键直接切换.
# 弹幕显示时 uosc_danmaku 会加 fps 滤镜把画面补到 60 帧, 每帧预算只有 16.7 ms:
#   实测 (Smooth Motion, 全屏 2560x1440, 1080p 24 帧「爆炎」):
#   开着该滤镜: Fast 5.95 ms/帧、无丢帧; HQ 约 17.5 ms/帧, 30 秒丢 387 帧.
#   关掉弹幕: 按片源帧率渲染, 每帧预算 41.7 ms; HQ 16.9 ms/帧, 30 秒无丢帧.
# 所以看弹幕用 Fast; HQ 留给关掉弹幕时用.
Ctrl+1 cycle-values glsl-shaders "~~/shaders/anime4k/Anime4K_Clamp_Highlights.glsl:~~/shaders/anime4k/Anime4K_Restore_CNN_M.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_S.glsl" ""; show-text "Anime4K Fast: ${?glsl-shaders==:关}${!glsl-shaders==:开}"    #! 画面 > Anime4K Fast 开关
Ctrl+2 cycle-values glsl-shaders "~~/shaders/anime4k/Anime4K_Clamp_Highlights.glsl:~~/shaders/anime4k/Anime4K_Restore_CNN_VL.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_M.glsl" ""; show-text "Anime4K HQ: ${?glsl-shaders==:关}${!glsl-shaders==:开}"    #! 画面 > Anime4K HQ 开关
b           cycle deband                                  #! 画面 > 去色带开关
s           screenshot                                    #! 画面 > 截图 (带字幕)
S           screenshot video                              #! 画面 > 截图 (不带字幕)

# 弹幕
# 插件自带的 j / Ctrl+d 绑定已在 script-opts/uosc_danmaku.conf 里关掉
Ctrl+d      script-message-to uosc_danmaku show_danmaku_keyboard     #! 弹幕 > 开关
Ctrl+D      script-message-to uosc_danmaku open_add_total_menu       #! 弹幕 > 综合菜单
Alt+d       script-message-to uosc_danmaku open_search_danmaku_menu  #! 弹幕 > 搜索
#           script-message-to uosc_danmaku open_danmaku_style_menu   #! 弹幕 > 样式
# 不带 ${=time-pos}: 带了只移动当前位置之后的弹幕, 屏幕上的不动. 0 是重置 (清空所有弹幕源的延迟).
Alt+x       script-message danmaku-delay 1                #! 弹幕 > 延迟 +1 秒
Alt+y       script-message danmaku-delay -1               #! 弹幕 > 延迟 -1 秒
#           script-message danmaku-delay 0                #! 弹幕 > 延迟重置
#           script-message-to uosc_danmaku immediately_save_danmaku  #! 弹幕 > 保存弹幕

# 工具
I           script-binding stats/display-stats-toggle     #! 工具 > 统计信息
~           script-binding console/enable                 #! 工具 > 控制台
#           set clipboard/text "${path}"; show-text "已复制文件路径"           #! 工具 > 复制文件路径
#           set clipboard/text "${playback-time/full}"; show-text "已复制当前时间"    #! 工具 > 复制当前时间
#           script-binding uosc/delete-file-next          #! 工具 > 删除当前文件并播放下一个

# 开启了 save-position-on-quit, quit 本身就会保存进度, 所以不另设「退出并保存进度」.
q           quit                                          #! 退出
