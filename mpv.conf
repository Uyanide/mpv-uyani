# 原则上只写与默认值不同的项.

# 视频输出与解码
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe

# 界面
osc=no                                     # uosc 与内置 OSC 冲突

# 播放行为
idle=yes                                   # 播放结束后停在空闲界面
hr-seek=yes                                # 所有跳转都精确到帧
directory-mode=ignore                      # 打开目录时不递归子目录
autocreate-playlist=same                   # 打开单个文件时，把同目录同类型的文件加入播放列表
metadata-codepage=auto
title=${media-title}

# 续播与历史
save-position-on-quit=yes
watch-later-dir=~~/files/watch_later
watch-later-options=start,vid,aid,sid      # 只记住进度和选中的轨道
resume-playback-check-mtime=yes            # 文件被替换后不误恢复
write-filename-in-watch-later-config=yes
save-watch-history=yes
watch-history-path=~~/files/watch_history.jsonl

# 截图
screenshot-format=webp
screenshot-webp-quality=85
screenshot-webp-compression=6
screenshot-template=~~/files/screen/%{media-title}-%P-%n

# 网络
ytdl-raw-options-append=cookies-from-browser=chrome+gnomekeyring
# 断线重连. 必须全局设置: 条件 profile 在流打开之后才生效, 对当前文件无效
stream-lavf-o-append=reconnect=1
stream-lavf-o-append=reconnect_at_eof=1
stream-lavf-o-append=reconnect_streamed=1

# 音频
# 输出 / 独占 / 采样率 / 声道 / ReplayGain 等均用默认值
audio-file-auto=fuzzy                      # 自动加载外挂音轨
audio-file-paths=audio:audios:audio 5.1:audios 5.1:audio 7.1:audios 7.1:音轨    # Linux 上路径列表用 : 分隔
alang=ja,en                                # ja 同时匹配 jpn 标签

# 字幕
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles:字幕
slang=chs,sc,zh-Hans,zh-CN,cht,tc,zh-Hant,zh-HK,zh-TW,zh    # 简体 → 繁体 → 其他中文
sub-font=Noto Sans CJK SC
sub-font-size=50
sub-bold=yes
sub-outline-size=0.5
sub-shadow-offset=0.5
sub-back-color="#000000"                   # 引号不能丢喵, 否则会被当注释

# 画质
profile=high-quality                       # 内置: scale=ewa_lanczossharp 等
deband=yes                                 # 默认参数; mpv 默认键 b 开关
# 插帧可用 N 卡的 Smooth Motion, 这里不写
# 着色器默认不开
gpu-shader-cache-dir=~~/cache/shaders

# 条件 profile

[network]
# 网络源加大缓冲 (cache 对网络源默认已开启)
profile-cond=demuxer_via_network
profile-restore=copy
demuxer-max-bytes=1GiB
demuxer-readahead-secs=120

[pgs-fix]
# 宽于 16:9 的视频, 把图形字幕 (PGS) 拉伸到屏幕，修正位置错位
profile-cond=get("video-params/aspect") > 16 / 9
profile-restore=copy
stretch-image-subs-to-screen=yes

[maximized]
# 最大化时换文件不调整窗口大小
profile-cond=window_maximized and vid and not get("current-tracks/video/albumart")
profile-restore=copy-equal
auto-window-resize=no

[minimized]
# 最小化时自动暂停
profile-cond=window_minimized and vid and not get("current-tracks/video/albumart")
profile-restore=copy-equal
pause

[end]
# 播放列表结束后退出全屏 / 最大化
profile-cond=idle_active
no-fullscreen
no-window-maximized
