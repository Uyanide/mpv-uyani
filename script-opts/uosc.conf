# 原则上只写与默认值不同的项 (默认值见 vendor/uosc/src/uosc.conf).
# 注意: script-opts 文件不支持行尾注释, 注释必须单独占一行.

# 外观
timeline_style=bar
timeline_size=30
progress_line_width=10
menu_padding=1
border_radius=2
color=foreground=FFFBFE,foreground_text=1C1B1F,background=1C1B1F,background_text=FFFBFE
opacity=menu=0.9,submenu=0.7,curtain=0.5
# 时间显示到毫秒
time_precision=3
disable_elements=idle_indicator,audio_indicator
# 空闲时常驻控制栏
controls_persistency=idle

# 控制栏
# button:danmaku_menu 和 show_danmaku@uosc_danmaku 由 uosc_danmaku 提供
controls=menu,open-file,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<has_chapter>chapters,<stream>stream-quality,button:danmaku_menu,cycle:toggle_on:show_danmaku@uosc_danmaku:on=toggle_on/off=toggle_off?弹幕开关,gap,space,<has_chapter>command:skip_previous:add chapter -1?上一章,<video,audio>speed,<has_chapter>command:skip_next:add chapter 1?下一章,space,loop-file,shuffle,loop-playlist,gap,<has_playlist>prev,<has_playlist>items,<has_playlist>next,gap,fullscreen

# 行为
# 文件按自然顺序排序 (e.g. 2 在 10 前)
refine=sorting
# 「删除并播放下一个」走系统回收站
use_trash=yes
# 章节范围: 在默认的日文 OP/ED 之外加上中英文片头片尾, 预告, 片尾字幕
chapter_ranges=openings:30abf964,endings:30abf964,intros:3fb95080,outros:3fb95080,ads:c54e4e80
chapter_range_patterns=openings:^Intro%s*Start,オープニング$,^片头$,片头开始$;endings:^end$,^End$,エンディング$;intros:preview$,预告$,予告$;outros:credits$
