# 原则上只写与默认值不同的项 (默认值见 vendor/uosc_danmaku/modules/options.lua).
# 注释必须单独占一行.

# 运行时文件放进 ~~/files/ , 默认会写到配置根目录。
history_path=~~/files/danmaku-history.json
search_history_path=~~/files/danmaku-search-history.json
# 屏蔽词文件, 每行一条 (支持 Lua 模式)
blacklist_path=~~/files/danmaku-blacklist.txt

# 关掉插件自带的键, 弹幕键统一写在 input.conf
show_danmaku_keyboard_key=
open_search_danmaku_menu_key=

# 弹幕显示时用 fps 滤镜把画面补到 60 帧, 弹幕更顺滑 (代价：每帧预算 16.7 ms, 开弹幕时 Anime4K 只能用 Fast 档)
vf_fps=yes

# 自动加载同名 xml / 网络视频的关联弹幕；播放结束把弹幕存成视频旁的 xml
autoload_local_danmaku=yes
autoload_for_url=yes
save_danmaku=yes

# 繁转简；合并同一时刻的重复弹幕
chConvert=1
merge_tolerance=0

# 样式. danmaku 是 fontconfig 别名 (见 DEPENDENCIES.md)
fontname=danmaku
fontsize=32
opacity=0.6
